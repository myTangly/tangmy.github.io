<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>tangmy.top</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}

canvas#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;z-index:0}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;z-index:1;pointer-events:none}
.overlay>*{pointer-events:auto}

/* ---- Left side: domain ---- */
.domain-section{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.domain-text{font-size:clamp(2.2rem,5.5vw,5.5rem);font-weight:900;color:#fff;letter-spacing:0.08em;user-select:none;text-shadow:
  0 0 10px rgba(0,212,255,0.8),
  0 0 30px rgba(0,212,255,0.6),
  0 0 60px rgba(168,85,247,0.5),
  0 0 100px rgba(168,85,247,0.3),
  0 0 150px rgba(236,72,153,0.2);position:relative}
.domain-text::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:60%;height:2px;background:linear-gradient(90deg,transparent,#00d4ff,#a855f7,#ec4899,transparent);border-radius:2px}

/* ---- Right side: 2048 ---- */
.game-section{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.game-container{background:rgba(255,255,255,0.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:clamp(12px,2vw,24px);width:min(420px,42vw,95vh);box-shadow:0 0 40px rgba(0,212,255,0.06)}

.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(10px,1.5vw,16px)}
.scores{display:flex;gap:clamp(8px,1vw,12px)}
.score-box{background:rgba(0,0,0,0.35);border-radius:8px;padding:clamp(4px,0.8vw,8px) clamp(10px,1.5vw,18px);text-align:center}
.score-box .label{font-size:clamp(10px,1vw,13px);color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px}
.score-box .value{font-size:clamp(16px,1.8vw,24px);font-weight:700;color:#fff}
.btn-new-game{background:linear-gradient(135deg,#00d4ff,#a855f7);border:none;border-radius:8px;color:#fff;font-size:clamp(13px,1.4vw,16px);font-weight:700;padding:clamp(6px,0.8vw,10px) clamp(14px,1.8vw,24px);cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 0 18px rgba(0,212,255,0.25)}
.btn-new-game:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(0,212,255,0.4)}
.btn-new-game:active{transform:scale(0.95)}

.grid-wrapper{position:relative;aspect-ratio:1/1;width:100%;background:rgba(0,0,0,0.3);border-radius:8px;padding:clamp(4px,0.6vw,8px)}
.grid-bg{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(4px,0.6vw,8px);width:100%;height:100%}
.cell{background:rgba(255,255,255,0.06);border-radius:4px}
.tile-layer{position:absolute;top:clamp(4px,0.6vw,8px);left:clamp(4px,0.6vw,8px);right:clamp(4px,0.6vw,8px);bottom:clamp(4px,0.6vw,8px)}
.tile{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;transition:top .12s ease,left .12s ease;text-shadow:0 1px 3px rgba(0,0,0,0.3);user-select:none;font-size:clamp(18px,2.2vw,32px)}
.tile.tile-new{animation:tileAppear .2s ease}
.tile.tile-merge{animation:tilePop .2s ease}
@keyframes tileAppear{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes tilePop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

.game-over-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.game-over-overlay h2{font-size:clamp(24px,3vw,40px);color:#fff;margin-bottom:clamp(8px,1vw,16px)}
.game-over-overlay p{font-size:clamp(14px,1.4vw,18px);color:rgba(255,255,255,0.6);margin-bottom:clamp(12px,1.5vw,20px)}
.game-over-overlay button{background:linear-gradient(135deg,#00d4ff,#a855f7);border:none;border-radius:8px;color:#fff;font-size:clamp(14px,1.4vw,18px);font-weight:700;padding:clamp(8px,0.8vw,12px) clamp(20px,2.5vw,36px);cursor:pointer;transition:transform .15s}
.game-over-overlay button:hover{transform:scale(1.05)}

.win-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.win-overlay h2{font-size:clamp(28px,3.5vw,44px);color:#ffd700;margin-bottom:clamp(8px,1vw,16px);text-shadow:0 0 20px rgba(255,215,0,0.5)}
.win-overlay p{font-size:clamp(14px,1.4vw,18px);color:rgba(255,255,255,0.6);margin-bottom:clamp(12px,1.5vw,20px)}
.win-overlay button{background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:8px;color:#000;font-size:clamp(14px,1.4vw,18px);font-weight:700;padding:clamp(8px,0.8vw,12px) clamp(20px,2.5vw,36px);cursor:pointer;margin:clamp(4px,0.5vw,8px);transition:transform .15s}
.win-overlay button:hover{transform:scale(1.05)}
.win-overlay .btn-keep-going{background:rgba(255,255,255,0.15);color:#fff}

/* ---- Tile colors (dark theme) ---- */
.tile-2{background:#1a3a5c;color:#e0f0ff}
.tile-4{background:#1c4a6e;color:#e0f0ff}
.tile-8{background:#00b4d8;color:#fff}
.tile-16{background:#0096c7;color:#fff}
.tile-32{background:#0077b6;color:#fff}
.tile-64{background:#023e8a;color:#fff}
.tile-128{background:linear-gradient(135deg,#6a4c93,#00b4d8);color:#fff;font-size:clamp(14px,1.6vw,26px)}
.tile-256{background:linear-gradient(135deg,#6a4c93,#0096c7);color:#fff;font-size:clamp(14px,1.6vw,26px)}
.tile-512{background:linear-gradient(135deg,#a855f7,#00d4ff);color:#fff;font-size:clamp(14px,1.6vw,26px)}
.tile-1024{background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;font-size:clamp(12px,1.4vw,22px)}
.tile-2048{background:linear-gradient(135deg,#ffd700,#ff6b6b);color:#fff;font-size:clamp(12px,1.4vw,22px);text-shadow:0 0 10px rgba(255,215,0,0.4)}
.tile-super{background:linear-gradient(135deg,#ff6b6b,#ffd700,#ff6b6b);background-size:200% 200%;animation:shimmer 2s linear infinite;color:#fff;font-size:clamp(10px,1.2vw,18px)}
@keyframes scoreUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-35px) translateX(5px)}}.score-popup{position:absolute;color:#ffd700;font-weight:900;font-size:clamp(16px,1.8vw,26px);pointer-events:none;z-index:20;animation:scoreUp .7s ease-out forwards;text-shadow:0 0 12px rgba(255,215,0,0.7)}@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

@media(max-width:680px){
  .overlay{flex-direction:column}
  .domain-section{flex:0 0 20%}
  .domain-text{font-size:clamp(1.6rem,5vw,2.8rem)}
  .domain-text::after{width:40%}
  .game-section{flex:1;align-items:flex-start;padding-top:6px}
  .game-container{width:min(92vw,400px);padding:12px}
}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="overlay">
  <div class="domain-section">
    <div class="domain-text">tangmy.top</div>
  </div>
  <div class="game-section">
    <div class="game-container" id="gameContainer">
      <div class="game-header">
        <div class="scores">
          <div class="score-box"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
          <div class="score-box"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
        </div>
        <button class="btn-new-game" id="btnNewGame">New Game</button>
      </div>
      <div class="grid-wrapper" id="gridWrapper">
        <div class="grid-bg">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div class="tile-layer" id="tileLayer"></div>
        <div class="game-over-overlay" id="gameOverOverlay" style="display:none">
          <h2>Game Over!</h2>
          <p id="finalScore">Score: 0</p>
          <button id="btnRetry">Try Again</button>
        </div>
        <div class="win-overlay" id="winOverlay" style="display:none">
          <h2>You Win!</h2>
          <p>You reached 2048!</p>
          <div>
            <button id="btnKeepGoing" class="btn-keep-going">Keep Going</button>
            <button id="btnNewGameWin">New Game</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
// ============================================================
//   Particle System
// ============================================================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas(){
  const d=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*d;canvas.height=H*d;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const particles = [];
const MAX_PARTICLES = 200;
const CONNECT_DIST = 120;
const MOUSE_RADIUS = 150;
const TRAIL_SPAWN_RATE = 3;

const colors = ['#00d4ff','#22d3ee','#38bdf8','#818cf8','#a855f7','#c084fc','#e879f9','#ec4899','#f472b6'];

let mouse = {x: -9999, y: -9999, vx: 0, vy: 0, prevX: -9999, prevY: -9999, active: false};
let trailCounter = 0;

class Particle {
  constructor(x, y, sizedV){
    this.x = x != null ? x : Math.random() * W;
    this.y = y != null ? y : Math.random() * H;
    this.size = sizedV || (Math.random() * 2.5 + 1);
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.alpha = Math.random() * 0.7 + 0.3;
    this.maxLife = Math.random() * 200 + 150;
    this.life = this.maxLife;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 0.5 + 0.15;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.glow = Math.random() * 6 + 4;
  }

  update(){
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < MOUSE_RADIUS && dist > 0){
      const force = (1 - dist / MOUSE_RADIUS) * 0.08;
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;
      this.vx *= 0.98;
      this.vy *= 0.98;
    }

    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.02;
    this.vx *= 0.99;
    this.vy *= 0.99;

    const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if(spd > 2){ this.vx = (this.vx/spd)*2; this.vy = (this.vy/spd)*2; }

    this.x += this.vx;
    this.y += this.vy;

    if(this.x < -20) this.x = W+20;
    if(this.x > W+20) this.x = -20;
    if(this.y < -20) this.y = H+20;
    if(this.y > H+20) this.y = -20;

    this.life--;
    if(this.life <= 0) this.alpha = Math.max(0, this.alpha - 0.01);
    else this.alpha = Math.min(1, this.alpha + 0.002);
  }

  draw(){
    ctx.save();
    ctx.globalAlpha = this.alpha * 0.8;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.glow;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  alive(){ return this.life > -50 && this.alpha > 0.01; }
}

function connectParticles(){
  for(let i = 0; i < particles.length; i++){
    for(let j = i+1; j < particles.length; j++){
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = dx*dx + dy*dy;
      if(dist < CONNECT_DIST * CONNECT_DIST){
        const alpha = (1 - Math.sqrt(dist)/CONNECT_DIST) * 0.15;
        ctx.strokeStyle = 'rgba(168,168,255,' + alpha + ')';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

function spawnTrail(x, y){
  for(let i = 0; i < TRAIL_SPAWN_RATE; i++){
    if(particles.length >= MAX_PARTICLES) break;
    const offsetX = (Math.random() - 0.5) * 12;
    const offsetY = (Math.random() - 0.5) * 12;
    const p = new Particle(x + offsetX, y + offsetY, Math.random() * 2 + 1.5);
    p.life = 80 + Math.random() * 60;
    p.vx = (Math.random() - 0.5) * 1.2;
    p.vy = (Math.random() - 0.5) * 1.2;
    p.alpha = 0.6 + Math.random() * 0.4;
    particles.push(p);
  }
}

function spawnBackgroundParticles(){
  while(particles.length < MAX_PARTICLES * 0.7){
    const p = new Particle();
    p.life = 300 + Math.random() * 300;
    particles.push(p);
  }
}

// ---- Stars ----
const stars = [];
for(let i = 0; i < 80; i++){
  stars.push({
    x: Math.random() * W, y: Math.random() * H,
    size: Math.random() * 1.8 + 0.3,
    alpha: Math.random() * 0.6 + 0.1,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
    phase: Math.random() * Math.PI * 2
  });
}

function drawStars(time){
  for(const s of stars){
    const a = s.alpha * (0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.phase));
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  }
}

// ---- Mouse events ----
canvas.addEventListener('mousemove', e=>{
  mouse.prevX = mouse.x;
  mouse.prevY = mouse.y;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.vx = mouse.x - mouse.prevX;
  mouse.vy = mouse.y - mouse.prevY;
  if(!mouse.active) mouse.active = true;
});
canvas.addEventListener('mouseleave', ()=>{
  mouse.active = false;
  mouse.x = -9999; mouse.y = -9999;
});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const t = e.touches[0];
  mouse.prevX = mouse.x;
  mouse.prevY = mouse.y;
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.vx = mouse.x - mouse.prevX;
  mouse.vy = mouse.y - mouse.prevY;
  if(!mouse.active) mouse.active = true;
}, {passive: false});
canvas.addEventListener('touchend', ()=>{
  mouse.active = false;
  mouse.x = -9999; mouse.y = -9999;
});

let animTime = 0;

function animateParticles(){
  animTime += 1;

  if(mouse.active && mouse.x > 0 && mouse.y > 0){
    trailCounter++;
    if(trailCounter % 2 === 0){
      const spd = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
      if(spd > 0.5) spawnTrail(mouse.x, mouse.y);
    }
  }

  spawnBackgroundParticles();

  for(let i = particles.length-1; i >= 0; i--){
    particles[i].update();
    if(!particles[i].alive()) particles.splice(i,1);
  }

  while(particles.length > MAX_PARTICLES) particles.pop();

  ctx.clearRect(0, 0, W, H);

  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  grad.addColorStop(0, '#0f0f2a');
  grad.addColorStop(0.5, '#0a0a1a');
  grad.addColorStop(1, '#050510');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  drawStars(animTime);
  connectParticles();

  for(const p of particles) p.draw();

  requestAnimationFrame(animateParticles);
}

window.addEventListener('resize', ()=>{
  for(const s of stars){
    s.x = Math.random() * W;
    s.y = Math.random() * H;
  }
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(repositionTiles,80);
});

animateParticles();

// ============================================================
//   2048 Game
// ============================================================
const SIZE = 4;
let grid = [];
let score = 0;
let best = parseInt(localStorage.getItem('tangmy2048best')) || 0;
let gameOver = false;
let won = false;
let keepPlaying = false;
let nextTileId = 1;
let tileDomMap = new Map();
let animating = false;

const tileLayer = document.getElementById('tileLayer');
const scoreEl = document.getElementById('scoreValue');
const bestEl = document.getElementById('bestValue');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreEl = document.getElementById('finalScore');
const winOverlay = document.getElementById('winOverlay');

bestEl.textContent = best;

function emptyGrid(){
  return Array.from({length:SIZE},()=>Array(SIZE).fill(0));
}

function cloneGrid(g){
  return g.map(r=>[...r]);
}

function getEmptyCells(g){
  const cells=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(g[r][c]===0) cells.push({r,c});
  return cells;
}

function addRandomTile(g){
  const cells=getEmptyCells(g);
  if(!cells.length) return null;
  const {r,c}=cells[Math.floor(Math.random()*cells.length)];
  const id=nextTileId++;
  const value=Math.random()<0.9?2:4;
  g[r][c]={id,value};
  return {r,c,value,id};
}

function getTileLayout(){
  const wr=tileLayer.getBoundingClientRect();
  const gap=parseFloat(getComputedStyle(document.querySelector('.grid-bg')).gap)||6;
  const inner=wr.width;
  const ts=(inner-gap*(SIZE-1))/SIZE;
  const toPx=(r,c)=>({left:c*(ts+gap),top:r*(ts+gap)});
  return {tileSize:ts,gap,toPx};
}

function createTileEl(id,value,r,c){
  const {toPx,tileSize}=getTileLayout();
  const {left,top}=toPx(r,c);
  const el=document.createElement('div');
  const cls=value>2048?'tile-super':'tile-'+value;
  el.className='tile '+cls;
  el.textContent=value;
  el.style.width=tileSize+'px';
  el.style.height=tileSize+'px';
  el.style.left=left+'px';
  el.style.top=top+'px';
  el.style.fontSize=value>=1000?'clamp(10px,1.2vw,18px)':value>=100?'clamp(14px,1.6vw,26px)':'clamp(18px,2.2vw,32px)';
  tileLayer.appendChild(el);
  tileDomMap.set(id,el);
  return el;
}

function moveTileEl(id,r,c){
  const el=tileDomMap.get(id);
  if(!el) return;
  const {toPx}=getTileLayout();
  const {left,top}=toPx(r,c);
  el.style.left=left+'px';
  el.style.top=top+'px';
}

function removeTileEl(id){
  const el=tileDomMap.get(id);
  if(!el) return;
  el.remove();
  tileDomMap.delete(id);
}
// ---- Reposition tiles on resize ----
let resizeTimer;
function repositionTiles(){
  const layout=getTileLayout();
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const t=grid[r][c];
    if(t&&t!==0){
      const el=tileDomMap.get(t.id);
      if(el){
        el.style.width=layout.tileSize+'px';
        el.style.height=layout.tileSize+'px';
        const p=layout.toPx(r,c);
        el.style.left=p.left+'px';
        el.style.top=p.top+'px';
      }
    }
  }
}

// Rotate grid 90-deg clockwise
function rotateGrid(g){
  const ng=emptyGrid();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) ng[c][SIZE-1-r]=g[r][c];
  return ng;
}

// Rotate grid 90-deg counter-clockwise
function rotateGridReverse(g){
  const ng=emptyGrid();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) ng[SIZE-1-c][r]=g[r][c];
  return ng;
}

// Merge adjacent equal tiles in an array, tracking consumed columns
function mergeRow(row, srcCols){
  const merges=[];
  const items=[...row];
  const cols=[...srcCols];
  for(let i=0;i<items.length-1;i++){
    if(items[i].value===items[i+1].value){
      const newVal=items[i].value*2;
      score+=newVal;
      const newId=nextTileId++;
      merges.push({fromId1:items[i].id,fromId2:items[i+1].id,value:newVal,newId});
      items[i]={id:newId,value:newVal};
      items.splice(i+1,1);
      cols.splice(i+1,1);
    }
  }
  return {items, cols, merges};
}

// Slide a grid that's already oriented "left"
function slideLeftOnGrid(g){
  const allMoves=[];
  const allMerges=[];
  let moved=false;
  const newG=emptyGrid();
  for(let r=0;r<SIZE;r++){
    const row=[];
    const srcCols=[];
    for(let c=0;c<SIZE;c++) if(g[r][c]!==0){ row.push(g[r][c]); srcCols.push(c); }
    const {items,cols,merges}=mergeRow(row,srcCols);
    const result=Array(SIZE).fill(0);
    for(let i=0;i<items.length;i++) result[i]=items[i];
    newG[r]=result;
    if(!moved) for(let c=0;c<SIZE;c++) if((g[r][c]===0&&result[c]!==0)||(g[r][c]!==0&&result[c]===0)||(g[r][c]!==0&&result[c]!==0&&g[r][c].id!==result[c].id)){ moved=true; break; }
    for(let i=0;i<items.length;i++){
      const isMerge=merges.find(m=>m.newId===items[i].id);
      if(!isMerge && cols[i]!==i) allMoves.push({id:items[i].id,fromR:r,fromC:cols[i],toR:r,toC:i});
    }
    for(const m of merges){
      const landIdx=items.findIndex(it=>it.id===m.newId);
      if(landIdx>=0) allMerges.push({fromId1:m.fromId1,fromId2:m.fromId2,toR:r,toC:landIdx,value:m.value,newId:m.newId});
    }
  }
  return {grid:newG,moved,allMoves,allMerges};
}

// Undo n clockwise rotations
// ---- Undo ----
const MAX_HISTORY=5;let history=[];
function saveState(){history.push({grid:cloneGrid(grid),score:score,nextTileId:nextTileId});if(history.length>MAX_HISTORY)history.shift();}
function undo(){if(!history.length||animating)return;const s=history.pop();grid=s.grid;score=s.score;nextTileId=s.nextTileId;gameOver=false;won=false;keepPlaying=false;gameOverOverlay.style.display='none';winOverlay.style.display='none';tileDomMap.forEach(el=>el.remove());tileDomMap.clear();for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]!==0)createTileEl(grid[r][c].id,grid[r][c].value,r,c);updateScore();}
// ---- Score popup ----
function showScorePopup(r,c,val){const el=document.createElement('div');el.className='score-popup';el.textContent='+'+val;const{toPx}=getTileLayout();const{left,top}=toPx(r,c);el.style.left=left+'px';el.style.top=top+'px';tileLayer.appendChild(el);setTimeout(()=>el.remove(),700);}

function move(dir){
  if(gameOver||(won&&!keepPlaying)||animating) return;saveState();

  let current=cloneGrid(grid);
  let result;
  let unrotateGridFn, unrotateCoordFn;

  if(dir==='left'){
    result=slideLeftOnGrid(current);
    unrotateGridFn=(g)=>g;
    unrotateCoordFn=(r,c)=>({r,c});
  }
  else if(dir==='right'){
    for(let i=0;i<2;i++) current=rotateGrid(current);
    result=slideLeftOnGrid(current);
    unrotateGridFn=(g)=>{let ng=g;for(let i=0;i<2;i++)ng=rotateGridReverse(ng);return ng;};
    unrotateCoordFn=(r,c)=>{for(let i=0;i<2;i++){const nr=SIZE-1-c;const nc=r;r=nr;c=nc;}return {r,c};};
  }
  else if(dir==='up'){
    // UP: CCW rotation so column-top-to-bottom becomes row-left-to-right
    current=rotateGridReverse(current);
    result=slideLeftOnGrid(current);
    unrotateGridFn=rotateGrid; // CW undoes CCW
    unrotateCoordFn=(r,c)=>({r:c,c:SIZE-1-r}); // CW on coordinates
  }
  else{ // down
    // DOWN: CW rotation so column-bottom-to-top becomes row-left-to-right
    current=rotateGrid(current);
    result=slideLeftOnGrid(current);
    unrotateGridFn=rotateGridReverse; // CCW undoes CW
    unrotateCoordFn=(r,c)=>({r:SIZE-1-c,c:r}); // CCW on coordinates
  }

  if(!result.moved) return;

  let newG=unrotateGridFn(result.grid);

  // Unrotate moves
  for(const m of result.allMoves){
    const f=unrotateCoordFn(m.fromR,m.fromC);
    const t=unrotateCoordFn(m.toR,m.toC);
    m.fromR=f.r; m.fromC=f.c; m.toR=t.r; m.toC=t.c;
  }
  // Unrotate merges
  for(const m of result.allMerges){
    const t=unrotateCoordFn(m.toR,m.toC);
    m.toR=t.r; m.toC=t.c;
  }

  animating=true;
  grid=newG;

  // Phase 1: move existing tiles
  for(const m of result.allMoves) moveTileEl(m.id,m.toR,m.toC);
  // Phase 2: remove consumed tiles
  for(const m of result.allMerges){ removeTileEl(m.fromId1); removeTileEl(m.fromId2); }
  // Phase 3: create merged tiles with pop
  for(const m of result.allMerges){ const el=createTileEl(m.newId,m.value,m.toR,m.toC); el.classList.add('tile-merge');showScorePopup(m.toR,m.toC,m.value); }
  // Phase 4: spawn random tile with appear
  const spawn=addRandomTile(grid);
  if(spawn){ const el=createTileEl(spawn.id,spawn.value,spawn.r,spawn.c); el.classList.add('tile-new'); }
  // Phase 5: clean orphaned DOM
  const activeIds=new Set();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]!==0) activeIds.add(grid[r][c].id);
  for(const [id] of tileDomMap){ if(!activeIds.has(id)) removeTileEl(id); }

  updateScore();

  setTimeout(()=>{
    for(const el of tileLayer.querySelectorAll('.tile-merge,.tile-new')) el.classList.remove('tile-merge','tile-new');
    animating=false;
    checkGameOver();
    checkWin();
  },180);
}function canMove(g){
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(g[r][c]===0) return true;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(c<SIZE-1&&g[r][c]!==0&&g[r][c+1]!==0&&g[r][c].value===g[r][c+1].value) return true;
    if(r<SIZE-1&&g[r][c]!==0&&g[r+1][c]!==0&&g[r][c].value===g[r+1][c].value) return true;
  }
  return false;
}

function checkGameOver(){
  if(!canMove(grid)){ gameOver=true; finalScoreEl.textContent='Score: '+score; gameOverOverlay.style.display='flex'; }
}

function checkWin(){
  if(won||keepPlaying) return;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++)
    if(grid[r][c]!==0&&grid[r][c].value===2048){ won=true; winOverlay.style.display='flex'; return; }
}

function updateScore(){
  scoreEl.textContent=score;
  if(score>best){ best=score; localStorage.setItem('tangmy2048best',best); }
  bestEl.textContent=best;
}

function initGame(){
  grid=emptyGrid(); score=0; gameOver=false; won=false; keepPlaying=false;
  nextTileId=1; animating=false;
  tileDomMap.forEach(el=>el.remove()); tileDomMap.clear();
  const t1=addRandomTile(grid); const t2=addRandomTile(grid);
  if(t1) createTileEl(t1.id,t1.value,t1.r,t1.c);
  if(t2) createTileEl(t2.id,t2.value,t2.r,t2.c);
  updateScore();
  gameOverOverlay.style.display='none'; winOverlay.style.display='none';saveState();
}

// ---- Keyboard ----
document.addEventListener('keydown',e=>{
  const map={'ArrowLeft':'left','ArrowUp':'up','ArrowRight':'right','ArrowDown':'down'};
  if(map[e.key]){ e.preventDefault(); move(map[e.key]); }if(e.key==='z'||e.key==='Z'){ e.preventDefault(); undo(); }
});

// ---- Touch swipe ----
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];touchStartX=t.clientX;touchStartY=t.clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const t=e.changedTouches[0]; const dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(Math.max(ax,ay)<20) return;
  move(ax>ay?(dx>0?'right':'left'):(dy>0?'down':'up'));
},{passive:true});

// ---- Buttons ----
document.getElementById('btnNewGame').addEventListener('click',initGame);
document.getElementById('btnRetry').addEventListener('click',initGame);
document.getElementById('btnNewGameWin').addEventListener('click',initGame);
document.getElementById('btnKeepGoing').addEventListener('click',()=>{keepPlaying=true;winOverlay.style.display='none';});

initGame();</script>
